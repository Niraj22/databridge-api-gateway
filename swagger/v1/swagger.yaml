---
openapi: 3.0.1
info:
  title: DataBridge API Gateway
  version: v1
  description: The API Gateway for the DataBridge microservices architecture
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    error:
      type: object
      properties:
        error:
          type: string
paths:
  "/api/v1/customers/{customer_id}/addresses":
    parameters:
    - name: customer_id
      in: path
      description: Customer ID
      required: true
      schema:
        type: string
    get:
      summary: list addresses
      tags:
      - Addresses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: addresses found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    customer_id:
                      type: integer
                    address_type:
                      type: string
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                      nullable: true
                    postal_code:
                      type: string
                    country:
                      type: string
                    is_default:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
        '401':
          description: unauthorized
        '404':
          description: customer not found
    post:
      summary: create address
      tags:
      - Addresses
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: address created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  customer_id:
                    type: integer
                  address_type:
                    type: string
                  street:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                    nullable: true
                  postal_code:
                    type: string
                  country:
                    type: string
                  is_default:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '401':
          description: unauthorized
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address_type:
                  type: string
                  enum:
                  - shipping
                  - billing
                street:
                  type: string
                city:
                  type: string
                state:
                  type: string
                postal_code:
                  type: string
                country:
                  type: string
                is_default:
                  type: boolean
              required:
              - address_type
              - street
              - city
              - postal_code
              - country
  "/api/v1/customers/{customer_id}/addresses/{id}":
    parameters:
    - name: customer_id
      in: path
      description: Customer ID
      required: true
      schema:
        type: string
    - name: id
      in: path
      description: Address ID
      required: true
      schema:
        type: string
    get:
      summary: show address
      tags:
      - Addresses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: address found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  customer_id:
                    type: integer
                  address_type:
                    type: string
                  street:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                    nullable: true
                  postal_code:
                    type: string
                  country:
                    type: string
                  is_default:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '404':
          description: address not found
    put:
      summary: update address
      tags:
      - Addresses
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: address updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  customer_id:
                    type: integer
                  address_type:
                    type: string
                  street:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                    nullable: true
                  postal_code:
                    type: string
                  country:
                    type: string
                  is_default:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '404':
          description: address not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address_type:
                  type: string
                  enum:
                  - shipping
                  - billing
                street:
                  type: string
                city:
                  type: string
                state:
                  type: string
                postal_code:
                  type: string
                country:
                  type: string
                is_default:
                  type: boolean
    delete:
      summary: delete address
      tags:
      - Addresses
      security:
      - bearer_auth: []
      responses:
        '204':
          description: address deleted
        '404':
          description: address not found
  "/api/v1/auth/login":
    post:
      summary: Authenticates user
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: user authenticated
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/api/v1/auth/register":
    post:
      summary: Registers a new user
      tags:
      - Authentication
      parameters: []
      responses:
        '201':
          description: user created
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
                role:
                  type: string
                  enum:
                  - customer
                  - admin
              required:
              - email
              - password
              - name
  "/api/v1/auth/refresh":
    post:
      summary: Refreshes authentication token
      tags:
      - Authentication
      security:
      - bearer_auth: []
      responses:
        '200':
          description: token refreshed
        '401':
          description: unauthorized
  "/api/v1/categories":
    get:
      summary: Lists all categories
      tags:
      - Categories
      parameters:
      - name: include_inactive
        in: query
        required: false
        description: Include inactive categories
        schema:
          type: boolean
      - name: parent_id
        in: query
        required: false
        description: Filter by parent category
        schema:
          type: integer
      - name: root
        in: query
        required: false
        description: Only return root categories
        schema:
          type: boolean
      responses:
        '200':
          description: categories found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    description:
                      type: string
                      nullable: true
                    parent_id:
                      type: integer
                      nullable: true
                    active:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
    post:
      summary: Creates a category
      tags:
      - Categories
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  parent_id:
                    type: integer
                    nullable: true
                  active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                parent_id:
                  type: integer
                  nullable: true
                active:
                  type: boolean
              required:
              - name
  "/api/v1/categories/{id}":
    parameters:
    - name: id
      in: path
      description: Category ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieves a category
      tags:
      - Categories
      responses:
        '200':
          description: category found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  parent_id:
                    type: integer
                    nullable: true
                  active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  subcategories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        parent_id:
                          type: integer
                        active:
                          type: boolean
        '404':
          description: category not found
    put:
      summary: Updates a category
      tags:
      - Categories
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  parent_id:
                    type: integer
                    nullable: true
                  active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '404':
          description: category not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                parent_id:
                  type: integer
                  nullable: true
                active:
                  type: boolean
    delete:
      summary: Deletes a category
      tags:
      - Categories
      security:
      - bearer_auth: []
      responses:
        '204':
          description: category deleted
        '404':
          description: category not found
  "/api/v1/customers":
    get:
      summary: Lists customers
      tags:
      - Customers
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
      - name: sort_direction
        in: query
        required: false
        enum:
        - asc
        - desc
        schema:
          type: string
        description: ":\n * `asc` \n * `desc` \n "
      responses:
        '200':
          description: customers found
        '401':
          description: unauthorized
    post:
      summary: Creates a customer
      tags:
      - Customers
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: customer created
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
              required:
              - name
              - email
              - password
  "/api/v1/customers/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Retrieves a customer
      tags:
      - Customers
      security:
      - bearer_auth: []
      responses:
        '200':
          description: customer found
        '404':
          description: customer not found
    put:
      summary: Updates a customer
      tags:
      - Customers
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: customer updated
        '404':
          description: customer not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
    delete:
      summary: Deletes a customer
      tags:
      - Customers
      security:
      - bearer_auth: []
      responses:
        '204':
          description: customer deleted
        '404':
          description: customer not found
  "/api/v1/products/{product_id}/inventory":
    parameters:
    - name: product_id
      in: path
      description: Product ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieves product inventory
      tags:
      - Inventories
      security:
      - bearer_auth: []
      responses:
        '200':
          description: inventory found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  product_id:
                    type: integer
                  quantity:
                    type: integer
                  low_stock_threshold:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '404':
          description: product not found
    put:
      summary: Updates product inventory
      tags:
      - Inventories
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: inventory updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  product_id:
                    type: integer
                  quantity:
                    type: integer
                  low_stock_threshold:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                low_stock_threshold:
                  type: integer
              required:
              - quantity
  "/api/v1/inventories/batch":
    post:
      summary: Batch updates multiple product inventories
      tags:
      - Inventories
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: batch update successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id:
                          type: integer
                        quantity:
                          type: integer
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                inventories:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                      quantity:
                        type: integer
                    required:
                    - product_id
                    - quantity
              required:
              - inventories
  "/api/v1/orders":
    get:
      summary: Lists all orders
      tags:
      - Orders
      parameters:
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Items per page
        schema:
          type: integer
      - name: status
        in: query
        required: false
        description: Filter by status (created, processing, fulfilled, canceled)
        schema:
          type: string
      - name: customer_id
        in: query
        required: false
        description: Filter by customer ID
        schema:
          type: integer
      - name: start_date
        in: query
        format: date
        required: false
        description: Filter by start date (YYYY-MM-DD)
        schema:
          type: string
      - name: end_date
        in: query
        format: date
        required: false
        description: Filter by end date (YYYY-MM-DD)
        schema:
          type: string
      - name: sort_by
        in: query
        required: false
        description: Field to sort by (created_at, total_amount, status)
        schema:
          type: string
      - name: sort_direction
        in: query
        required: false
        enum:
        - asc
        - desc
        description: "Sort direction:\n * `asc` \n * `desc` \n "
        schema:
          type: string
      security:
      - bearer_auth: []
      responses:
        '200':
          description: orders found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    customer_id:
                      type: integer
                    status:
                      type: string
                      enum:
                      - created
                      - processing
                      - fulfilled
                      - canceled
                    total_amount:
                      type: number
                      format: float
                    notes:
                      type: string
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Creates an order
      tags:
      - Orders
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  customer_id:
                    type: integer
                  status:
                    type: string
                  total_amount:
                    type: number
                    format: float
                  notes:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                line_items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                      quantity:
                        type: integer
                      unit_price:
                        type: number
                        format: float
                    required:
                    - product_id
                    - quantity
                    - unit_price
              required:
              - line_items
  "/api/v1/orders/{id}":
    parameters:
    - name: id
      in: path
      description: Order ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieves an order
      tags:
      - Orders
      security:
      - bearer_auth: []
      responses:
        '200':
          description: order found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  customer_id:
                    type: integer
                  status:
                    type: string
                  total_amount:
                    type: number
                    format: float
                  notes:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  line_items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        order_id:
                          type: integer
                        product_id:
                          type: integer
                        quantity:
                          type: integer
                        unit_price:
                          type: number
                          format: float
                        total_price:
                          type: number
                          format: float
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        order_id:
                          type: integer
                        amount:
                          type: number
                          format: float
                        payment_method:
                          type: string
                        status:
                          type: string
                        transaction_id:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  shipments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        order_id:
                          type: integer
                        tracking_number:
                          type: string
                          nullable: true
                        carrier:
                          type: string
                          nullable: true
                        status:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
        '404':
          description: order not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    put:
      summary: Updates an order
      tags:
      - Orders
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  customer_id:
                    type: integer
                  status:
                    type: string
                  total_amount:
                    type: number
                    format: float
                  notes:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '404':
          description: order not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - created
                  - processing
                  - fulfilled
                  - canceled
    delete:
      summary: Cancels an order
      tags:
      - Orders
      security:
      - bearer_auth: []
      responses:
        '204':
          description: order canceled
        '404':
          description: order not found
        '401':
          description: unauthorized
  "/api/v1/orders/{order_id}/payments":
    parameters:
    - name: order_id
      in: path
      description: Order ID
      required: true
      schema:
        type: integer
    get:
      summary: Lists all payments for an order
      tags:
      - Payments
      security:
      - bearer_auth: []
      responses:
        '200':
          description: payments found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    order_id:
                      type: integer
                    amount:
                      type: number
                      format: float
                    payment_method:
                      type: string
                      enum:
                      - credit_card
                      - paypal
                      - bank_transfer
                    status:
                      type: string
                      enum:
                      - pending
                      - completed
                      - failed
                    transaction_id:
                      type: string
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
        '404':
          description: order not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Creates a payment for an order
      tags:
      - Payments
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: payment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  order_id:
                    type: integer
                  amount:
                    type: number
                    format: float
                  payment_method:
                    type: string
                    enum:
                    - credit_card
                    - paypal
