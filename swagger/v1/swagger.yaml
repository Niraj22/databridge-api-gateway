---
openapi: 3.0.1
info:
  title: DataBridge API Gateway
  version: v1
  description: The API Gateway for the DataBridge microservices architecture
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    error:
      type: object
      properties:
        error:
          type: string
paths:
  "/api/v1/analytics/dashboard":
    get:
      summary: Gets dashboard data
      tags:
      - Analytics
      security:
      - bearer_auth: []
      responses:
        '200':
          description: dashboard data found
        '401':
          description: unauthorized
  "/api/v1/analytics/reports":
    get:
      summary: Gets analytics reports
      tags:
      - Analytics
      security:
      - bearer_auth: []
      parameters:
      - name: report_type
        in: query
        required: true
        enum:
        - sales
        - orders
        - products
        - customers
        schema:
          type: string
        description: ":\n * `sales` \n * `orders` \n * `products` \n * `customers`
          \n "
      - name: start_date
        in: query
        format: date
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        format: date
        required: true
        schema:
          type: string
      - name: granularity
        in: query
        required: false
        enum:
        - day
        - week
        - month
        schema:
          type: string
      responses:
        '200':
          description: report data found
        '401':
          description: unauthorized
        '422':
          description: invalid request
  "/api/v1/auth/login":
    post:
      summary: Authenticates user
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: user authenticated
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/api/v1/auth/register":
    post:
      summary: Registers a new user
      tags:
      - Authentication
      parameters: []
      responses:
        '201':
          description: user created
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
                role:
                  type: string
                  enum:
                  - customer
                  - admin
              required:
              - email
              - password
              - name
  "/api/v1/auth/refresh":
    post:
      summary: Refreshes authentication token
      tags:
      - Authentication
      security:
      - bearer_auth: []
      responses:
        '200':
          description: token refreshed
        '401':
          description: unauthorized
  "/api/v1/customers":
    get:
      summary: Lists customers
      tags:
      - Customers
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
      - name: sort_direction
        in: query
        required: false
        enum:
        - asc
        - desc
        schema:
          type: string
        description: ":\n * `asc` \n * `desc` \n "
      responses:
        '200':
          description: customers found
        '401':
          description: unauthorized
    post:
      summary: Creates a customer
      tags:
      - Customers
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: customer created
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
              required:
              - name
              - email
              - password
  "/api/v1/customers/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Retrieves a customer
      tags:
      - Customers
      security:
      - bearer_auth: []
      responses:
        '200':
          description: customer found
        '404':
          description: customer not found
    put:
      summary: Updates a customer
      tags:
      - Customers
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: customer updated
        '404':
          description: customer not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
    delete:
      summary: Deletes a customer
      tags:
      - Customers
      security:
      - bearer_auth: []
      responses:
        '204':
          description: customer deleted
        '404':
          description: customer not found
  "/api/v1/orders":
    get:
      summary: Lists orders
      tags:
      - Orders
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
      - name: sort_direction
        in: query
        required: false
        enum:
        - asc
        - desc
        schema:
          type: string
        description: ":\n * `asc` \n * `desc` \n "
      - name: start_date
        in: query
        format: date
        required: false
        schema:
          type: string
      - name: end_date
        in: query
        format: date
        required: false
        schema:
          type: string
      responses:
        '200':
          description: orders found
        '401':
          description: unauthorized
    post:
      summary: Creates an order
      tags:
      - Orders
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: order created
        '401':
          description: unauthorized
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                products:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: string
                      quantity:
                        type: integer
                shipping_address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    zip:
                      type: string
                    country:
                      type: string
                payment_method:
                  type: string
                notes:
                  type: string
              required:
              - products
              - shipping_address
              - payment_method
  "/api/v1/products":
    get:
      summary: Lists products
      tags:
      - Products
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
      - name: sort_direction
        in: query
        required: false
        enum:
        - asc
        - desc
        schema:
          type: string
        description: ":\n * `asc` \n * `desc` \n "
      - name: min_price
        in: query
        required: false
        schema:
          type: number
      - name: max_price
        in: query
        required: false
        schema:
          type: number
      responses:
        '200':
          description: products found
    post:
      summary: Creates a product
      tags:
      - Products
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: product created
        '401':
          description: unauthorized
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                category_id:
                  type: string
                inventory_count:
                  type: integer
                active:
                  type: boolean
              required:
              - name
              - price
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
